let CB=[];

const bar=v=>{const n=Math.round(clamp(v,0,100)/10);return `<span class="bar">${'■'.repeat(n)}</span><span class="dim">${'□'.repeat(10-n)}</span> ${Math.round(v)}`};
function hud(){
 const y=2020+Math.floor(S.turn/2),h=S.turn%2?'하반기':'상반기';
 const spark=S.matHist.slice(-12).map(v=>'▁▂▃▄▅▆▇█'[clamp(Math.floor((v-50)/22),0,7)]).join('');
 const tl=TIER[S.tier].n+(S.disguise?' (위장 분할!)':S.grace>0&&S.tier>=2?` (졸업유예 ${S.grace}턴)`:'');
 return `<header class="hud"><div class="row"><b>📅 ${y}년 ${h}</b><span class="dim">턴 ${Math.min(S.turn+1,TURNS)}/${TURNS}</span><span>💰 <b style="color:${S.cash<.2?'var(--r)':'var(--y)'}">${fmt(S.cash)}</b></span><span>${TIER[S.tier].e} ${tl}</span><span>⚡ ${S.ap}/2</span><span class="top-r">${B(snd?'🔊':'🔇',()=>{snd=!snd;rerender()})}</span></div>
 <div class="stats"><span>품질 ${bar(S.q)}</span><span>기술 ${bar(S.t)}</span><span>청렴 ${bar(S.integ)}</span><span>신뢰 ${bar(S.rep)}</span>${S.aff>0?`<span style="color:var(--p)">💗 ${bar(S.aff)}</span>`:''}</div>
 <div class="row" style="font-size:13px"><span>🔶 원자재(구리) 지수 <b>${Math.round(S.mat)}</b> <span style="color:var(--b)">${spark}</span></span><span>재고 ${S.stock}</span>${S.release?'<span class="badge">🏛️ 비축물자 방출중</span>':''}${S.mas?'<span class="badge g">🛒MAS</span>':''}${S.excellent?'<span class="badge g">🏅우수조달</span>':''}${S.innov?'<span class="badge b">💡혁신제품</span>':''}${S.global?'<span class="badge p">🌏해외</span>':''}${S.green?'<span class="badge g">🌱녹색</span>':''}</div></header>`}
let rerender=()=>{};

function dlg(who,text,btns){const [n,img]=SPK[who];const name=typeof n==='function'?n():n||S.name+' 사장';

function say(lines,then){let i=0;const step=()=>{if(i>=lines.length)return then&&then();const [w,t]=lines[i++];rerender=()=>render(()=>dlg(w,t,B('다음 ▶',step,'pri')));rerender()};step()}
function choose(who,text,opts){rerender=()=>render(()=>dlg(who,text,opts.map(([l,f,c])=>B(l,f,c||'')).join('<br>')));sfx.evt();rerender()}
function runQ(q,fin){const n=()=>q.length?q.shift()(n):fin();n()}

let fanCache=null;
function fanImg(){if(fanCache)return fanCache;const n=16,cv=document.createElement('canvas');cv.width=cv.height=n;const x=cv.getContext('2d');
 for(let py=0;py<n;py++)for(let px=0;px<n;px++){const dx=px+.5-8,dy=py+.5-8,rr=Math.hypot(dx,dy),a=(Math.atan2(dy,dx)*180/Math.PI+360)%120;let c=null;
  if(rr<1.6)c='#ffd23f';else if(rr>6.6&&rr<7.6)c='#9aa0b8';else if(rr<6.4&&a<50)c=a<25?'#a8d8ff':'#6cb6ff';
  if(c){x.fillStyle=c;x.fillRect(px,py,1,1)}}
 return fanCache=cv.toDataURL()}

function intro(){say([
 ['sys',`${S.name}. 손때 묻은 공구와 조용하고 튼튼한 선풍기, 그리고 통장 잔고 <b>2억</b>.`],
 ['kim','안녕하세요! 조달청 나라장터 교육 담당 <b>김주무관</b>입니다.'],
 ['kim','사장님 공방 선풍기, 조용하고 튼튼하다고 소문났던데요? 공공기관에 납품해보시는 건 어떠세요?'],
 ['kim','학교·시청·경로당의 구매는 전부 <b>나라장터</b>에 공고로 올라와요. 공고를 고르고, 예비가격 2개를 찍고, 투찰률만 써내면 끝!'],
 ['kim','그리고 사장님 같은 <b>소기업</b>은 소액 수의계약 같은 혜택도 있어요. 품질 관리도 잊지 마시고요. 화이팅!'],
 ['me','좋아, 한번 해보자. 목표는… 세계의 교실에 시원한 바람을!']],()=>{seePol('nara');startTurn()})}

function genNotices(){
 const pool=[];if(S.tier<=1)pool.push('small');pool.push('sme');if(S.wins>=1||S.tier>=2)pool.push('general');if(S.total>=10||S.tier>=2)pool.push('large');if(S.global)pool.push('overseas');
 const n=S.recT>0?2:3,out=[];
 for(let i=0;i<n;i++){const w=pool.map((_,k)=>k+1),sum=w.reduce((a,b)=>a+b);let r=Math.random()*sum,k=0;while(r>w[k]){r-=w[k];k++}
  const type=pool[k],sp=NT[type];out.push({type,item:pick(ITEMS[type]),ag:pick(PLACES)+' '+pick(AGS),base:+R(sp.b[0],sp.b[1]).toFixed(3),comp:RI(sp.c[0],sp.c[1]),suui:type==='small'&&S.tier===0&&Math.random()<.5})}
 S.notices=out}

function startTurn(resume){
 if(S.turn>=TURNS)return finalEnding();
 if(!resume){S.ap=2;S.bidDone=false;genNotices();if(S.recT>0)S.recT--}
 store.set('pps_save',S);
 if(resume)return hub();
 const ev=FIXED[S.turn];
 if(ev)return ev(hub);
 if(S.turn>0&&Math.random()<.5)return pick(RANDOM)(hub);
 hub()}

function hub(){rerender=()=>render(()=>`
 <section class="panel"><h2>📰 나라장터 공고</h2>${S.bidDone?'<p class="dim">이번 반기 입찰은 마쳤어요.</p>':'<p class="dim">한 반기에 한 건만 입찰할 수 있어요.</p>'}
 <div class="cards">${S.notices.map((n,i)=>noticeCard(n,i)).join('')}</div></section>
 <section class="panel"><h2>🧰 활동 <small>(⚡ ${S.ap}회 남음)</small></h2><div class="acts">${ACTS.filter(a=>!a.show||a.show()).map(actBtn).join('')}</div></section>
 <p style="text-align:right">${B('반기 마감 ▶',settle,'pri')}</p>`);rerender()}

function elig(n){if(S.banT>0)return `입찰참가자격 제한 중 (${S.banT}턴)`;if(n.type==='sme'&&!isSME())return '중소기업만 참가 가능';if(n.type==='general'&&S.wins<1)return '납품실적 1건 이상';if(n.type==='large'&&S.total<25)return '누적 계약실적 25억 이상';if(n.type==='overseas'&&!S.global)return '해외조달 진출 필요';return null}
function noticeCard(n,i){const sp=NT[n.type],why=elig(n),e=estCost(n),units=e.units,price=n.suui?n.base*.9:n.base*(fr(n.type)+.006),prof=price-e.labor-e.buy;
 return `<div class="card ${n.done?'done':''}"><span class="badge ${sp.cls}">${n.suui?'소액 수의계약':sp.n}</span><div class="t">${n.item}</div><small>${n.ag} · 기초금액 <b>${fmt(n.base)}</b><br>경쟁 약 ${n.comp}개사 · 하한율 ${frp(n.type)}<br>적격심사 품질 ${sp.qReq}+<br>🔶 원자재(구리) ${units}개 필요 → ${e.use?`재고 ${e.use}개 + `:''}${units-e.use?`부족분 시세 ${fmt(e.buy)}`:'전부 재고로!'}<br>💰 예상 이익 <b style="color:${prof<0?'var(--r)':'var(--g)'}">${fmt(prof)}</b> <span class="dim">(${n.suui?'수의계약':'하한율+0.6% 낙찰 시'})</span></small><br>
 ${n.done?'<small>마감</small>':S.bidDone?'':why?`<small style="color:var(--r)">🔒 ${why}</small>`:n.suui?B('🤝 수의계약 체결',()=>suui(i),'pri'):B('📨 입찰 참여',()=>openBid(i),'pri')}</div>`}

// ---------- 입찰 ----------
function suui(i){const n=S.notices[i];n.done=true;S.bidDone=true;usePol('sme_priority');dict('수의계약');
 const r=contract(n,n.base*.9);sfx.win();say([['kim',`소액 구매는 <b>소기업·소상공인과 수의계약</b>을 할 수 있어요. 작은 기업의 첫걸음을 응원하는 제도예요!`],['sys',r]],hub)}
function openBid(i){const n=S.notices[i];S.cur={i,n,picks:[],rate:+(fr(n.type)*100+.6).toFixed(3),yega:Array.from({length:15},()=>n.base*(1+R(-.02,.02)))};
 dict('기초금액','투찰','예비가격','예정가격','낙찰하한율');
 if(['sme','general','large'].includes(n.type)&&S.turn-(S.lastOffer??-99)>=6&&Math.random()<.08){S.lastOffer=S.turn;return collusionOffer()}
 bidScreen()}
function bidScreen(){const c=S.cur,n=c.n,lo=Math.floor(fr(n.type)*98)-2,hi=Math.ceil(fr(n.type)*102)+4;
 rerender=()=>{render(()=>`<section class="panel"><h2>📄 ${n.item} <small>${NT[n.type].n}</small></h2>
 <p>${n.ag} · 기초금액 <b>${won(n.base)}</b> · 경쟁 ${n.comp}개사 · 낙찰하한율 <b>${frp(n.type)}</b></p>
 <h3>① 예비가격 번호 2개 고르기 (${c.picks.length}/2)</h3><p class="dim" style="font-size:13px">실제 나라장터처럼 금액은 개찰 때 공개돼요. 번호만 고르세요!</p>
 <div class="yega">${c.yega.map((v,k)=>B(`${k+1}번<small>???</small>`,()=>{const p=c.picks.indexOf(k);if(p>=0)c.picks.splice(p,1);else if(c.picks.length<2)c.picks.push(k);rerender()},c.picks.includes(k)?'on':'')).join('')}</div>
 <h3>② 투찰률 정하기 <small>(기초금액 대비 %)</small></h3>
 <div class="rate"><input type="range" id="rr" min="${lo}" max="${hi}" step="0.001" value="${c.rate}"><input type="number" id="rn" min="${lo}" max="${hi}" step="0.001" value="${c.rate}"></div>
 <p>투찰금액 <b id="amt">${won(n.base*c.rate/100)}</b> · <span id="risk"></span></p>
 <p class="hint">💡 예정가격은 기초금액의 약 98~102% 사이에서 정해져요. 그러면 하한선은 기초금액의 약 <b>${(fr(n.type)*98).toFixed(1)}% ~ ${(fr(n.type)*102).toFixed(1)}%</b>.<br>${S.sajung&&S.sajung.length?`📊 최근 사정률(예정가격÷기초금액) 기록: ${S.sajung.slice(-5).map(v=>(v*100).toFixed(2)+'%').join(' · ')}<br>`:''}하한선보다는 높게, 경쟁사보다는 낮게! 0.1% 차이로 순위가 갈려요.</p>
 ${c.tip?`<p class="hint" style="border-color:var(--p)">${c.tip}</p>`:''}
 ${B('📨 투찰하기',()=>resolveBid(false),'pri',c.picks.length<2)} ${c.tip?'':B('🔎 투찰 조언 듣기',()=>{c.tip=bidTip(n);rerender()},'pink')} ${B('취소',hub)}</section>`);
 const rr=document.getElementById('rr'),rn=document.getElementById('rn'),amt=document.getElementById('amt');
 const rk=document.getElementById('risk'),upd=v=>{v=clamp(+v||lo,lo,hi);c.rate=v;amt.textContent=won(n.base*v/100);const p=floorRisk(n,v);
  rk.innerHTML=`하한 미달 위험 <b style="color:${p>.5?'var(--r)':p>.2?'var(--y)':'var(--g)'}">약 ${Math.round(p*100)}%</b> <small>(${p>.5?'위험!':p>.2?'아슬아슬':'안전한 편'} · 90% 안전선 ${(fr(n.type)*100*(1+.0074)).toFixed(2)}%)</small>`};upd(c.rate);
 rr.oninput=()=>{rn.value=rr.value;upd(rr.value)};rn.onchange=()=>{upd(rn.value);rn.value=c.rate;rr.value=c.rate}};rerender()}

// 하한선 = 예정가격×하한율, 예정가격은 ±2% 균등 15개 중 4개 평균 → 표준편차 ≈ 0.58%
function floorRisk(n,rate){const m=fr(n.type)*100,sd=m*.0058,z=(rate-m)/sd;return 1-1/(1+Math.exp(-1.702*z))}
function bidTip(n){const h=(S.sajung||[]).slice(-5),avg=h.length?h.reduce((a,b)=>a+b)/h.length:1,est=fr(n.type)*100;
 const who=S.romance==='declared'?'📞 조달청 고객지원센터: "김주무관은 이해충돌 회피 중이라 제가 대신 안내드려요."':'💬 김주무관:';
 return `${who}<br>"사정률은 매번 새로 추첨되지만 평균은 100% 근처예요${h.length?` (최근 평균 ${(avg*100).toFixed(2)}%)`:''}. 그래서 하한선은 기초금액의 <b>${est.toFixed(2)}%</b> 근처예요.
 ${n.comp>=8?`경쟁사가 ${n.comp}곳이나 되니 하한선에 바짝 붙이세요. <b>${(est+.4).toFixed(2)}~${(est+.8).toFixed(2)}%</b> 추천!`:`경쟁사가 ${n.comp}곳뿐이니 조금 여유 있게, <b>${(est+.7).toFixed(2)}~${(est+1.2).toFixed(2)}%</b> 정도면 안전해요.`}
 아래 <b>하한 미달 위험</b> 숫자도 꼭 보세요!"`}
function collusionOffer(){const n=S.cur.n;dict('들러리입찰');
 choose('rival',`"${S.name} 사장, 이번 '${n.item}' 건 말이야… 우리 업체들이 들러리 서줄 테니 넉넉하게 써서 가져가. 다음 건은 우리 차례고. 다들 그렇게 해~"`,[
 ['🤝 제안을 받아들인다',()=>{S.collusion++;(S.collTurns=S.collTurns||[]).push(S.turn);S.integ=clamp(S.integ-25,0,100);log('⚠️ 들러리 입찰 담합에 가담했다…');S.cur.picks=shuffle([...Array(15).keys()]).slice(0,2);resolveBid(true)}],
 ['🙅 거절한다 — 실력으로 붙자!',()=>{S.integ=clamp(S.integ+5,0,100);usePol('fair');say([['me','그런 건 안 합니다. 공정하게 붙읍시다.'],['rival','쳇, 순진하긴… 후회할 텐데.'],['kim','(나중에 들은 이야기) 거절 잘하셨어요! 조달청은 입찰 데이터를 분석해서 <b>담합을 잡아내요</b>. 걸리면 공공입찰 참가가 막혀요.']],bidScreen)}]])}

function resolveBid(collude){const c=S.cur,n=c.n,cnt=Array(15).fill(0);
 c.picks.forEach(k=>cnt[k]++);
 const names=shuffle(RIVALS).slice(0,n.comp);
 names.forEach(()=>{const a=RI(0,14);let b;do b=RI(0,14);while(b===a);cnt[a]++;cnt[b]++});
 const key=cnt.map(v=>v+Math.random()*.5),order=[...Array(15).keys()].sort((a,b)=>key[b]-key[a]),top=order.slice(0,4);
 const yj=top.reduce((s,k)=>s+c.yega[k],0)/4,floorP=yj*fr(n.type);(S.sajung=S.sajung||[]).push(yj/n.base);
 const bids=names.map(nm=>({nm,p:collude?yj*R(.96,1):n.base*fr(n.type)*R(.99,1.06)}));
 bids.push({nm:S.name+' (나)',me:1,p:collude?yj*.95:n.base*c.rate/100});
 bids.forEach(b=>b.ok=b.p>=floorP);
 bids.sort((a,b)=>(b.ok-a.ok)||(a.p-b.p));
 let winner=null;
 for(const b of bids){if(!b.ok){b.st='하한 미달';continue}if(winner){b.st='';continue}
  if(b.me&&!(S.q>=NT[n.type].qReq||S.excellent)){b.st='적격심사 탈락';continue}
  winner=b;b.st='🏆 낙찰'}
 n.done=true;S.bidDone=true;usePol('nara');usePol('yega');dict('적격심사');
 const me=bids.find(b=>b.me),meRank=bids.indexOf(me);
 let res;
 if(winner&&winner.me){const first=!S.wins;res=contract(n,me.p)+kimReact(first?'first':'win');S.lossStreak=0;if(n.type==='sme')usePol('sme_comp');sfx.win()}
 else{sfx.lose();res=me.st==='하한 미달'?`😵 하한선 미달! 추첨 결과 하한선이 <b>${(floorP/n.base*100).toFixed(3)}%</b>로 정해졌는데, <b>${c.rate.toFixed(3)}%</b>를 써서 무효예요. 예비가격이 높게 뽑히면 하한선도 올라가요!`:me.st==='적격심사 탈락'?`😢 1순위였지만 <b>적격심사 탈락</b>! 품질 ${NT[n.type].qReq} 이상이 필요해요.`:`😢 아쉽게 탈락! 낙찰은 <b>${winner?winner.nm:'없음'}</b> (투찰률 ${winner?(winner.p/n.base*100).toFixed(3):'-'}%).`;const bestAI=bids.filter(b=>b.ok&&!b.me).reduce((m,b)=>Math.min(m,b.p),Infinity);
  if(me.st!=='적격심사 탈락'&&bestAI<Infinity)res+=`<br>🎯 이번 입찰의 정답 구간: <b>${(floorP/n.base*100).toFixed(3)}% ~ ${(bestAI/n.base*100).toFixed(3)}%</b> (하한선 이상, 1위 경쟁사 미만)`;
  S.lossStreak=(S.lossStreak||0)+1;res+=kimReact(S.lossStreak>=3?'streak':me.st==='하한 미달'?'under':me.st==='적격심사 탈락'?'qual':'close',{d:Math.abs(((me.st==='하한 미달'?floorP:winner?winner.p:me.p)-me.p)/n.base*100).toFixed(2)});
  log(`${n.item} 입찰 탈락`)}
 // 표시는 투찰금액 오름차순 + 하한선 줄: 선 아래(더 싼 쪽)는 무효, 선 위 첫 업체가 낙찰
 const asc=[...bids].sort((a,b)=>a.p-b.p),fi=asc.findIndex(b=>b.ok),cut=fi<0?asc.length:fi;
 const below=asc.slice(0,cut).filter((b,k)=>b.me||k>=cut-3),above=asc.slice(cut).filter((b,k)=>b.me||k<5);
 const row=b=>`<tr class="${b.me?'me':''}" style="${b.ok?'':'opacity:.55'}"><td>${b.nm}</td><td>${(b.p/n.base*100).toFixed(3)}%</td><td>${b.ok?b.st||'':'❌ 하한 미달 (무효)'}</td></tr>`;
 rerender=()=>render(()=>`<section class="panel"><h2>📊 개찰 결과 — ${n.item}</h2>
 <h3>추첨된 예비가격 <small>(숫자 = 뽑힌 횟수, 노란색 = 선택된 4개, 초록 테두리 = 내 선택)</small></h3>
 <div class="yega">${c.yega.map((v,k)=>`<div class="cell ${top.includes(k)?'top':''} ${c.picks.includes(k)?'mine':''}">${won(v)}<br>${cnt[k]}표</div>`).join('')}</div>
 <p>예정가격 <b>${won(yj)}</b> (사정률 ${(yj/n.base*100).toFixed(3)}%) · 하한선 <b>${won(floorP)}</b> (기초 대비 ${(floorP/n.base*100).toFixed(3)}%)</p>
 <p class="hint">📏 하한선 = 예정가격 × ${frp(n.type)} = 기초금액의 <b>${(floorP/n.base*100).toFixed(3)}%</b>. 이보다 낮게 쓴 업체는 덤핑으로 보고 <b>무효</b>, 하한선 이상 중 <b>가장 낮은 업체</b>가 낙찰이에요.</p>
 <table><tr><th>업체 <small>(위로 갈수록 비싸게 씀)</small></th><th>투찰률</th><th>결과</th></tr>${above.slice().reverse().map(row).join('')}
 <tr><td colspan="3" style="color:var(--r);text-align:center;border-top:2px dashed var(--r);border-bottom:2px dashed var(--r)">━━ 하한선 ${(floorP/n.base*100).toFixed(3)}% ━━ 이 아래는 무효</td></tr>${below.slice().reverse().map(row).join('')}</table>
 <p class="tw">${res}</p>${B('확인',hub,'pri')}</section>`);rerender()}

// 원가 = 인건비(기술력↑ 절감) + 원자재(재고 먼저, 부족분은 그때 시세)
function estCost(n){const units=Math.ceil(n.base*30),use=Math.min(S.stock,units);return {units,use,buy:(units-use)*.01*S.mat/100,labor:n.base*.4*(1-S.t/330),saved:use*.01*S.mat/100}}
function contract(n,price){const sp=NT[n.type]||NT.general,{use,buy,labor,saved}=estCost(n);
 S.stock-=use;const fail=Math.random()<clamp((sp.diff-S.q)/150,0,.4),pen=fail?price*.1:0;
 const net=price-labor-buy-pen;S.cash+=net;S.halfRev+=price;S.wins++;S.total+=price;S.lastContract=price;S.rep=clamp(S.rep+(fail?-8:3),0,100);
 dict(fail?'지체상금':'납품검사');log(`${n.item} 계약 ${fmt(price)} → 순이익 ${fmt(net)}`);
 return `🎉 <b>${n.item}</b> 계약 ${fmt(price)}!<br><small>인건비 -${fmt(labor)} · 원자재 ${use?`재고 ${use}개 사용 + `:''}부족분 시세 구매 -${fmt(buy)}${fail?` · <span style="color:var(--r)">납품 지연 지체상금 -${fmt(pen)}</span>`:' · 납품검사 합격 ✅'}</small><br>순이익 <b>${fmt(net)}</b>${use?`<br>📦 재고 덕분에 원자재 <b>${fmt(saved)}</b> 절약! (지금 시세로 샀다면 그만큼 더 들었어요)`:''}`}

// ---------- 활동 ----------
const cst=k=>k*[1,2.5,12,40][S.tier]; // 규모별 비용 배수
const ACTS=[
 {n:'🔬 연구개발',d:'기술력↑ (원가 절감·혁신제품)',c:()=>cst(.06),run(){const g=Math.round((100-S.t)*.12)+2;S.t=clamp(S.t+g,0,100);return `기술력 +${g}`}},
 {n:'🛠️ 품질관리',d:'품질↑ (적격심사·납품검사)',c:()=>cst(.06),run(){const g=Math.round((100-S.q)*.12)+2;S.q=clamp(S.q+g,0,100);return `품질 +${g}`}},

 ['⚾ 야구장','9회 말 역전 찬스! 사장님, 같이 응원해요!',[['📣 목이 쉬도록 함께 응원',13,'이겼다!! 오늘 사장님이 승리 요정이에요!'],['🍗 치킨 먼저 챙긴다',8,'역시 사장님은 원가 관리 대신 치킨 관리…']]],
 ['🍜 조달청 앞 칼국수집','여기가 입찰 마감날 야근 메뉴예요. 사장님이랑 오니까 맛이 다르네요.',[['🥢 "앞으로 마감날엔 제가 데리러 올게요"',14,'…진짜죠? 계약서에 도장 찍은 거예요.'],['🧾 "오늘은 각자 계산할까요?"',6,'아, 네… 원칙적으론 맞는데… 오늘은 좀 서운하네요.']]],
 ['☔ 비 오는 퇴근길','우산을 깜빡했어요. 정류장까지만 같이 써도 될까요?',[['☂️ 우산을 기울여 씌워준다',15,'사장님 어깨 다 젖었잖아요… 바보.'],['🏃 "뛰면 금방이에요!"',6,'…같이 뛰어요! 하하, 이것도 나쁘지 않네요.']]],
 ['📚 북카페','저 요즘 국가계약법 해설서 읽어요. 사장님도 한 권 드릴까요?',[['📖 "주무관님이 밑줄 친 걸로 주세요"',13,'…그럼 제 메모도 다 보이는데. 부끄럽게.'],['😵 "법 얘기는 이제 그만…"',5,'흥, 그래도 하한율 바뀐 건 제 덕에 아셨잖아요!']]]];
function dateScene(){const [place,line,opts]=pick(DATES);
 choose('kimb',`<b>${place}</b><br>${line}`,opts.map(([l,d,reply])=>[l,()=>{S.aff=clamp(S.aff+d,0,100);log(`💗 ${place} 데이트`);
  const after=()=>{if(S.romance==='hidden'&&Math.random()<.35){S.hiddenRisk=(S.hiddenRisk||0)+.05;return say([['sys','📸 찰칵… 어디선가 셔터 소리가 들린 것 같아요. (감사 위험 증가)']],romanceCheck)}romanceCheck()};
  say([['kims',reply]],after)},'pink']))}
function romanceCheck(){
 if(S.romance==='friend')return hub();
 if(S.aff>=60&&S.affStage<3){S.affStage=3;return choose('kimb','사장님… 저 요즘 자꾸 사장님 회사 공고만 들여다보게 돼요. 이러면 안 되는데.',[
  ['💌 마음을 전하고, 이해충돌 신고를 함께 한다',()=>{S.romance='declared';S.integ=clamp(S.integ+10,0,100);usePol('conflict');say([['kimb','…저도요. 그럼 오늘 바로 <b>사적이해관계 신고</b>하고, 사장님 회사 업무에서는 빠질게요.'],['kims','공과 사는 확실히! 그게 우리 둘 다 지키는 방법이에요.']],hub)},'pink'],
  ['🤫 둘만의 비밀로 하자',()=>{S.romance='hidden';S.integ=clamp(S.integ-15,0,100);say([['kimb','…그래요. 아무도 모르게.'],['sys','⚠️ 신고하지 않은 사적 관계는 감사에서 드러날 수 있어요.']],hub)}],
  ['🙇 지금은 일에 집중하고 싶어요',()=>{S.romance='friend';S.aff=50;say([['kim','…네! 앞으로도 좋은 파트너로 지내요. 조달 상식은 계속 알려드릴게요.']],hub)}]])}
 if(S.romance==='declared'&&S.aff>=100&&S.affStage<4){S.affStage=4;return say([['kims','사장님, 이번 주말에… 조달청 말고 <b>우리 둘만의 계약서</b> 쓸래요?'],['me','…이건 경쟁 없이 수의계약이네요. 낙찰입니다.']],hub)}
 hub()}

// ---------- 정산 ----------
function settle(){const m=[];
 if(S.mas){const r=.3*(1+S.q/100)*(S.excellent?1.5:1)*(S.tier>=2?3:1)*(S.turn>=22&&!S.green?.5:1)*(S.recT>0?.6:1);S.halfRev+=r;S.cash+=r*.25;m.push(`🛒 종합쇼핑몰 주문 ${fmt(r)} → 이익 ${fmt(r*.25)}`)}
 const oh=TIER[S.tier].over;S.cash-=oh;m.push(`🏢 고정비 -${fmt(oh)}`);
 S.mat=clamp(S.mat+(100-S.mat)*.15+R(-8,8),50,260);S.matHist.push(S.mat);if(S.release>0)S.release--;
 const boost=S.aiAudit?1.8:1;
 // 입찰참가자격 제한은 위반행위 종료 후 5년(=10턴)이 지나면 처분 불가 (국가계약법 제27조 제4항)
 const act=(S.collTurns||[]).filter(t=>S.turn-t<10).length;
 if(act&&Math.random()<.08*act*boost){dict('입찰참가자격제한');return say([['audit','조달청 입찰 분석 결과, 귀사의 <b>들러리 입찰 담합</b> 정황이 확인됐습니다.']],()=>ending('banned'))}
 if((S.collTurns||[]).some(t=>S.turn-t===10)){dict('제척기간');m.push('⏳ 5년 전 담합 건의 <b>처분 기한이 지났어요</b>. 이제 제재할 수 없지만… 마음 한구석이 무거워요.')}
 if(S.banT>0){S.banT--;m.push(S.banT?`🚫 입찰참가자격 제한 ${S.banT}턴 남음`:'✅ 입찰참가자격 제한이 끝났어요. 다시 공정하게!')}
 if(S.disguise&&Math.random()<(S.tier>=3?.3:.12)*boost)return say([['audit','귀사와 분할된 회사들의 실질 지배관계를 조사한 결과, <b>위장 중소기업</b>으로 판단됩니다.']],()=>ending('disguise'));
 if(S.romance==='hidden'&&Math.random()<(.1+(S.hiddenRisk||0))*boost)return say([['audit','김주무관과 귀사 사이의 신고되지 않은 사적 관계에 대해 조사하겠습니다.']],()=>ending('audit'));
 const annual=S.halfRev+(S.rev[S.rev.length-1]||0);S.rev.push(S.halfRev);m.push(`📈 이번 반기 매출 ${fmt(S.halfRev)} · 최근 1년 ${fmt(annual)}`);S.halfRev=0;
 const tierOf=v=>{for(let i=3;i>=0;i--)if(v>=TH[i])return i;return 0};
 const h6=S.rev.slice(-6),avg3=h6.reduce((a,b)=>a+b,0)/(h6.length/2),raw=tierOf(annual),old=S.tier;
 const nt=raw>=old?raw:Math.max(raw,Math.min(old,tierOf(avg3)));S.tier=nt;
 if(raw<old&&nt===old)m.push(`🛡️ 올해 매출은 줄었지만 <b>최근 3년 평균 ${fmt(avg3)}</b> 덕분에 ${TIER[old].n} 규모를 유지해요.`);
 if(S.grace>0){S.grace--;if(!S.grace&&S.tier>=2)m.push('🎓 졸업 유예 종료 — 이제 중소기업 혜택은 없어요.')}
 if(nt!==old)m.push(`${TIER[nt].e} 회사 규모: ${TIER[old].n} → <b>${TIER[nt].n}</b>`);
 if(S.loanBal){S.cash-=S.loanBal;m.push(`🏦 네트워크론 상환 -${fmt(S.loanBal)}`);S.loanBal=0}
 // 자금이 바닥나면: 첫 1회는 창업 지원자금, 그다음부터는 최근 계약을 근거로 네트워크론(조달청 제도)
 if(S.cash<0&&!S.loan){S.loan=true;S.cash+=1.5;m.push('🆘 자금이 바닥나 <b>창업 지원자금 1.5억</b>을 받았어요. (단 한 번뿐!) 계약을 따면 조달청 <b>네트워크론</b>도 쓸 수 있어요.')}
 if(S.cash<0&&S.lastContract){const a=S.lastContract*.8;S.cash+=a;S.loanBal=a*1.03;S.lastContract=0;usePol('network');m.push(`🏦 자금이 바닥나 최근 계약서를 근거로 <b>네트워크론 ${fmt(a)}</b>을 받았어요. 다음 정산 때 이자와 함께 갚아야 해요.`)}
 if(S.cash<0)return say([['sys',`💸 자금이 ${fmt(S.cash)}… 더는 버틸 수 없어요.`]],()=>ending('bankrupt'));
const post=[];
 if(nt>old&&nt>(S.tierMax||0)){S.tierMax=nt;const L={1:'중소기업 승급 축하드려요! 이제 <b>중소기업자간 경쟁제품</b> 시장이 사장님 무대예요.',2:'중견기업이라니! 처음 공방에서 뵌 게 엊그제 같은데… 대형 공고에도 도전해 보세요.',3:'대기업… 진짜 해내셨네요. 이제 협력업체와의 <b>상생</b>도 꼭 챙겨주세요. 약속!'};post.push(d=>say([['kims',L[nt]]],d))}
 if(S.turn%2===1&&S.rep>=70&&S.wins>=3)post.push(d=>{S.rep=clamp(S.rep+5,0,100);S.integ=clamp(S.integ+3,0,100);sfx.win();say([['news',`<b>🏆 ${2020+Math.floor(S.turn/2)} 올해의 우수조달기업 시상식</b><br>${S.name}이(가) 성실 납품 기업으로 표창을 받았어요! 신뢰 +5, 청렴 +3`],['kims','무대 위 사장님, 완전 멋있었어요! 사진 찍어뒀어요. 업무용이에요, 업무용!']],d)});
 if(old<=1&&nt>=2&&!S.disguise&&!S.graceUsed)post.push(graduation);
 if(act&&!S.lenient&&Math.random()<.3)post.push(leniency);
 if(nt<=1&&annual>=TH[2]*.6&&!S.warned){S.warned=true;post.push(d=>{dict('졸업유예');say([['kim',`사장님, 연매출이 ${fmt(annual)}! 곧 <b>중견기업</b>이 되실 것 같아요.`],['kim','그러면 <b>중소기업자간 경쟁제품</b>이나 비축물자 할인 같은 중소기업 혜택에서 졸업이에요. 계획을 잘 세우세요!']],d)})}
 sfx.evt();
 rerender=()=>render(()=>`<section class="panel"><h2>🧾 ${2020+Math.floor(S.turn/2)}년 ${S.turn%2?'하반기':'상반기'} 정산</h2><p>${m.join('<br>')}</p><p>💰 잔고 <b>${fmt(S.cash)}</b></p>${B('다음 반기 ▶',()=>runQ(post,()=>{S.turn++;startTurn()}),'pri')}</section>`);rerender()}
function leniency(done){dict('자진신고감면');
 choose('news','<b>🕵️ 공정위 입찰담합 조사 소문</b><br>업계에 담합 조사가 시작됐다는 소문이 돌아요. 같이 담합한 박사장 쪽도 술렁인다는데…<br><small>※ 담합 가담자가 먼저 자진신고하면 과징금을 감면받아요(1순위 면제·2순위 50% 감경).</small>',[
 [`🙋 먼저 자진신고한다 (법률 비용 ${fmt(cst(.15))})`,()=>{S.cash-=cst(.15);S.lenient=true;S.collTurns=[];S.banT=2;S.integ=clamp(S.integ+20,0,100);S.rep=clamp(S.rep-10,0,100);usePol('fair');
  say([['audit','1순위 자진신고로 과징금은 <b>면제</b>, 입찰참가자격 제한은 <b>2턴으로 감경</b>합니다. 앞으로 성실히 협조해 주세요.'],['me','…이제야 발 뻗고 잘 수 있겠다.']],done)},'pri'],
 ['🤐 모른 척 버틴다',()=>{if(Math.random()<.3){dict('입찰참가자격제한');return say([['rival','미안하게 됐수다. <b>내가 먼저 자진신고했거든.</b> 감면은 1등만 받는 거 알지?'],['audit','자진신고 자료로 귀사의 담합이 확인됐습니다.']],()=>ending('banned'))}
  say([['sys','…아직은 조용해요. 하지만 조사는 계속될지도 몰라요.']],done)}]])}
function graduation(done){dict('졸업유예','위장중소기업');
 choose('sys',`🎓 축하해요! 연매출이 기준을 넘어 <b>중견기업</b>이 됐어요.<br>하지만 중소기업 전용 시장(중소기업자간 경쟁제품), 우수조달 신청, 비축물자 할인을 잃게 돼요…<br><br>그때 회계사가 속삭여요. "회사를 몇 개로 쪼개면 서류상으론 계속 중소기업인데요?"`,[
 ['📈 성장을 받아들인다 (졸업 유예 3년 적용)',()=>{S.grace=6;S.graceUsed=true;usePol('grace');say([['kim','<b>졸업 유예</b> 제도로 3년간은 중소기업 지위가 유지돼요. 그동안 대형 사업에 도전할 체력을 기르세요!']],done)},'pri'],
 ['✂️ 회사를 쪼갠다 (위장 분할)',()=>{S.disguise=true;S.graceUsed=true;S.integ=clamp(S.integ-30,0,100);say([['sys','⚠️ 서류상 중소기업이 됐어요. 하지만 조달청은 <b>위장 중소기업</b>을 꾸준히 단속해요.']],done)}]])}

 7:ev('혁신제품 시범구매 확대','💡','조달청이 혁신제품 지정 문턱을 낮췄어요! (혁신제품 신청 기술 요건 75 → 65)',()=>{S.innovReq=65;seePol('innov')}),
